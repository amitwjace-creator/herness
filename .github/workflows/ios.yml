name: iOS build and tests

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and simulator availability
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/Herness.xcodeproj
          xcrun simctl list devices available
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          for runtime in sorted(devices, reverse=True):
              if '.iOS-' not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print('IOS_SIMULATOR_UDID=' + device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator; install an iOS simulator runtime in Xcode.')
          PY
      - name: Build and run unit tests without signing credentials
        id: simulator_tests
        shell: bash
        run: |
          mkdir -p .build
          set +e
          set -o pipefail
          xcodebuild test \
            -project ios/Herness.xcodeproj \
            -scheme Herness \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath .build/ios \
            -resultBundlePath .build/HernessTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee .build/ios-tests.log
          build_status=$?
          set -e
          printf 'exit_code=%s\n' "$build_status" >> "$GITHUB_OUTPUT"
          exit "$build_status"
      - name: Build an unsigned iPhone archive
        id: iphone_archive
        shell: bash
        run: |
          mkdir -p .build
          set +e
          set -o pipefail
          xcodebuild archive \
            -project ios/Herness.xcodeproj \
            -scheme Herness \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios-release \
            -archivePath .build/Herness-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee .build/ios-archive.log
          build_status=$?
          set -e
          printf 'exit_code=%s\n' "$build_status" >> "$GITHUB_OUTPUT"
          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            .build/Herness-unsigned.xcarchive \
            .build/Herness-unsigned-iphone.xcarchive.zip
      - name: Package the unsigned device app for personal re-signing
        id: ipa_package
        shell: bash
        run: |
          set +e
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .build/ios-ipa.log
          import hashlib
          import plistlib
          import stat
          import struct
          import zipfile
          from pathlib import Path

          archive = Path('.build/Herness-unsigned.xcarchive')
          application = archive / 'Products/Applications/Herness.app'
          output = Path('.build/Herness-unsigned.ipa')
          for path in [archive, archive / 'Products', archive / 'Products/Applications', application]:
              if path.is_symlink() or not path.is_dir():
                  raise ValueError('Expected a real device archive containing Products/Applications/Herness.app')
          entries = [application, *sorted(application.rglob('*'))]
          for path in entries:
              mode = path.lstat().st_mode
              if not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                  raise ValueError('The app bundle contains a symlink or unsupported special file')
          info_path = application / 'Info.plist'
          if not info_path.is_file():
              raise ValueError('The archived app is missing Info.plist')
          info = plistlib.loads(info_path.read_bytes())
          if not isinstance(info, dict):
              raise ValueError('The archived app has an invalid Info.plist')
          if info.get('CFBundlePackageType') != 'APPL' or info.get('CFBundleExecutable') != 'Herness':
              raise ValueError('The archive does not contain the expected Herness application')
          platforms = info.get('CFBundleSupportedPlatforms', [])
          if not isinstance(platforms, list) or 'iPhoneOS' not in platforms:
              raise ValueError('IPA packaging requires the device app, not a simulator build')
          executable = application / 'Herness'
          if not executable.is_file() or not executable.stat().st_mode & 0o111:
              raise ValueError('The archived Herness executable is missing or not executable')
          with executable.open('rb') as binary:
              header = binary.read(16)
          # A generic iOS 17 device archive contains a thin 64-bit arm64 executable.
          if len(header) != 16 or struct.unpack('<IIII', header)[0:2] != (0xFEEDFACF, 0x0100000C) or struct.unpack('<IIII', header)[3] != 2:
              raise ValueError('Expected an arm64 Mach-O application executable from the device archive')
          with zipfile.ZipFile(output, 'x', compression=zipfile.ZIP_DEFLATED, compresslevel=9, strict_timestamps=False) as package:
              payload = zipfile.ZipInfo('Payload/')
              payload.external_attr = ((stat.S_IFDIR | 0o755) << 16) | 0x10
              package.writestr(payload, b'')
              for path in entries:
                  name = Path('Payload/Herness.app') / path.relative_to(application)
                  package.write(path, name.as_posix())
          with zipfile.ZipFile(output) as package:
              names = package.namelist()
              if package.testzip() is not None or 'Payload/Herness.app/Info.plist' not in names or 'Payload/Herness.app/Herness' not in names:
                  raise ValueError('The generated IPA failed its archive integrity check')
              if any(name != 'Payload/' and not name.startswith('Payload/Herness.app/') for name in names):
                  raise ValueError('The IPA contains an unexpected path outside its Payload')
          print('Created .build/Herness-unsigned.ipa from the real unsigned device archive.')
          print('This IPA requires personal or developer re-signing before installation; it has not been installed or signed by CI.')
          print('SHA-256: ' + hashlib.sha256(output.read_bytes()).hexdigest())
          PY
          package_status=$?
          set -e
          printf 'exit_code=%s\n' "$package_status" >> "$GITHUB_OUTPUT"
          exit "$package_status"
      - name: Report build and test diagnostics
        if: always()
        shell: bash
        env:
          SIMULATOR_TEST_OUTCOME: ${{ steps.simulator_tests.outcome }}
          SIMULATOR_TEST_EXIT_CODE: ${{ steps.simulator_tests.outputs.exit_code }}
          IPHONE_ARCHIVE_OUTCOME: ${{ steps.iphone_archive.outcome }}
          IPHONE_ARCHIVE_EXIT_CODE: ${{ steps.iphone_archive.outputs.exit_code }}
          IPA_PACKAGE_OUTCOME: ${{ steps.ipa_package.outcome }}
          IPA_PACKAGE_EXIT_CODE: ${{ steps.ipa_package.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          stages = [
              ('Simulator build and tests', '.build/ios-tests.log', 'SIMULATOR_TEST'),
              ('Unsigned iPhone archive', '.build/ios-archive.log', 'IPHONE_ARCHIVE'),
              ('Unsigned IPA packaging', '.build/ios-ipa.log', 'IPA_PACKAGE'),
          ]
          ansi = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          failure = re.compile(r'\berror:|\bfatal error:|\b(?:ValueError|OSError|FileExistsError|BadZipFile):|Test (?:Case|Suite).*\bfailed\b|Testing failed:|\*\* (?:TEST|BUILD|ARCHIVE) FAILED', re.I)
          location = re.compile(r'^(.*?):(\d+):(?:(\d+):)?\s*(?:fatal )?error:\s*(.*)$')
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()

          def clean(value):
              value = ansi.sub('', value)
              value = re.sub(r'[\x00-\x08\x0b-\x1f\x7f]', '', value).strip()
              value = re.sub(r'(?i)\bBearer\s+[A-Za-z0-9._~+/-]+=*', 'Bearer [redacted]', value)
              value = re.sub(r'(?i)\b((?:api[_-]?key|pairing[_-]?key|access[_-]?token|secret)\s*[:=]\s*)\S+', r'\1[redacted]', value)
              return value[:1500]

          def escape(value, property_value=False):
              value = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if property_value:
                  value = value.replace(':', '%3A').replace(',', '%2C')
              return value

          def annotate(title, line):
              properties = {'title': title}
              message = line
              match = location.match(line)
              if match:
                  source = Path(match.group(1))
                  source = source if source.is_absolute() else workspace / source
                  try:
                      relative = source.resolve().relative_to(workspace)
                  except (ValueError, OSError):
                      relative = None
                  if relative is not None:
                      properties.update(file=str(relative), line=match.group(2))
                      if match.group(3):
                          properties['col'] = match.group(3)
                      message = match.group(4)
              fields = ','.join(key + '=' + escape(value, True) for key, value in properties.items())
              print('::error ' + fields + '::' + escape(message))

          summary = ['## iOS build and test results', '', '| Stage | Outcome | Pipeline exit |', '| --- | --- | --- |']
          diagnostics = []
          test_counts = []
          for title, log_name, prefix in stages:
              outcome = os.environ.get(prefix + '_OUTCOME') or 'not run'
              exit_code = os.environ.get(prefix + '_EXIT_CODE') or 'not recorded'
              summary.append('| ' + title + ' | ' + outcome + ' | ' + exit_code + ' |')
              path = Path(log_name)
              found = []
              if path.exists():
                  with path.open(errors='replace') as log:
                      for raw in log:
                          line = clean(raw)
                          if re.search(r'Executed \d+ tests?, with ', line) and line not in test_counts:
                              test_counts.append(line)
                          if outcome == 'failure' and failure.search(line) and line not in found:
                              found.append(line)
                              if len(found) >= 30:
                                  break
              if outcome == 'failure' and not found:
                  found = ['The stage failed without a recognized compiler/test error line. Inspect its captured log and the step outcome.']
              diagnostics.extend((title, line) for line in found)

          summary += ['', 'The archive and IPA are unsigned. The IPA requires personal or developer re-signing before installation. CI does not establish signing, device installation, or TestFlight distribution.']
          if test_counts:
              summary += ['', '### Reported test counts', '<pre>' + html.escape('\n'.join(test_counts[-4:])) + '</pre>']
          if diagnostics:
              selected = diagnostics[:30]
              summary += ['', '### Compiler and test failures (up to 30)', '<pre>' + html.escape('\n'.join(title + ': ' + line for title, line in selected)) + '</pre>']
              for title, line in selected:
                  annotate(title, line)
          else:
              summary += ['', 'No failed build/test stage reported a compiler or test diagnostic. Check the stage outcomes above; skipped stages are not passes.']
          summary += ['', 'Captured build logs and the test result bundle are attached when available.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(summary) + '\n')
          PY
      - name: Preserve the unsigned IPA for personal re-signing
        if: ${{ always() && steps.ipa_package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Herness-unsigned-ipa
          path: .build/Herness-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the unsigned iPhone archive
        if: ${{ always() && steps.iphone_archive.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Herness-unsigned-iphone-archive
          path: .build/Herness-unsigned-iphone.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Herness-iOS-tests
          path: |
            .build/HernessTests.xcresult
            .build/ios-tests.log
            .build/ios-archive.log
            .build/ios-ipa.log
          if-no-files-found: ignore
          retention-days: 7
